name: LeetCode GitHub Sync

on:
  # Run automatically every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

  # Allows manual execution
  workflow_dispatch:

# Allow GitHub Actions to commit and push
permissions:
  contents: write

jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # RUN SYNC
      # ======================================================

      - name: Sync LeetCode submissions
        env:

          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}

          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}

          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}

          # GitHub Actions checks out the repository here
          GITHUB_REPO_DIR: ${{ github.workspace }}

          # Check up to 100 recent accepted submissions
          RECENT_LIMIT: "100"

        run: |
          python sync.py